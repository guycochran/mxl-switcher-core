# Example facility config for the immutable Core bundle (synthetic identities).
# The container sees the MXL domain at /mxl-domain and these definitions at
# /etc/mxl-switcher-core/definitions. Replace the source flow ids with your
# writers' current ids, or let the EasyMXL recovery workflow rebind them.
domain=/mxl-domain
source=cam-1|00000000-0000-4000-8000-000000000101|Camera 1
source=cam-2|00000000-0000-4000-8000-000000000102|Camera 2
program_definition=/etc/mxl-switcher-core/definitions/program.json
program_id=00000000-0000-4000-8000-000000000901
preview_definition=/etc/mxl-switcher-core/definitions/preview.json
preview_id=00000000-0000-4000-8000-000000000902
initial_program=cam-1
initial_preview=cam-2
width=1920
height=1080
rate_numerator=30
rate_denominator=1
input_delay_frames=1
control_host=0.0.0.0
control_port=18085
