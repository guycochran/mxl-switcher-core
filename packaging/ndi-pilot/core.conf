# Isolated NDI-to-MXL Core pilot. These UUIDs are owned by domain_ndi_lab.
domain=/dev/shm/mxl/domain_ndi_lab

source=ndi|4d584c10-2001-4c10-8000-000000000001|PRO CONVERT NDI
source=synthetic|4d584c10-2002-4c10-8000-000000000002|Synthetic fallback

program_definition=/opt/core/packaging/ndi-pilot/program.json
program_id=4d584c10-3001-4c10-8000-000000000001
preview_definition=/opt/core/packaging/ndi-pilot/preview.json
preview_id=4d584c10-3002-4c10-8000-000000000002

initial_program=ndi
initial_preview=synthetic

width=1920
height=1080
rate_numerator=30000
rate_denominator=1001

frames=0
take_every=0
# Runtime head indexes refer to committed grains. Selecting the newest common
# committed grain maximizes protection against a faster producer overwriting it
# before both output routes complete.
input_delay_frames=0
read_timeout_ns=20000000

control_host=127.0.0.1
control_port=18080
