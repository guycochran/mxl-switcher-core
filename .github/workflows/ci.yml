name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out MXL Switcher Core
        uses: actions/checkout@v4

      - name: Check out official MXL headers
        uses: actions/checkout@v4
        with:
          repository: dmf-mxl/mxl
          path: mxl-sdk

      - name: Build and test the engine
        run: make test

      - name: Check the live adapter against the MXL API
        run: make live-syntax MXL_INCLUDE=mxl-sdk/lib/include

      - name: Run the accelerated lifecycle soak
        run: ./build/core-tests --soak 1000000
